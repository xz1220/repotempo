  - slug: research-agents
    name: Research Agents
    description: Agents that search, investigate, synthesize sources, and produce research.
    status: active
  - slug: browser-computer-agents
    name: Browser and Computer Agents
    description: Agents that operate websites, browsers, desktop applications, and computers.
    status: active
  - slug: workflow-agents
    name: Workflow Agents
    description: AI agents for business processes, personal tasks, and repeatable automation.
    status: active
  - slug: agent-platforms
    name: Agent Platforms
    description: Frameworks and workspaces for building, coordinating, and supervising agents.
    status: active
    children:
      - slug: multi-agent
        name: Multi-Agent
