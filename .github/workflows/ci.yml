name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        go: ["1.27.x"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Test reading interactions and offline tools
        run: make test-js
      - name: Race detector
        if: matrix.go == '1.27.x'
        run: go test -race ./...
      - name: Build linux amd64
        if: matrix.go == '1.27.x'
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o repotempo ./cmd/repotempo

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache: true
      - name: Scan dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
